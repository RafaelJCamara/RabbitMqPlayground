# The web server of the container (ADR-0112): the static files of the Pages build, served as GitHub Pages serves them, with the headers that Pages
# cannot send. It replaces the server of the image's /etc/nginx/conf.d/default.conf, inside its http block.

# Hashed files (main-UDL4RPNA.js, chunk-B8vcw0zc.js, styles-YNOXH6BZ.css) never change under their name, so they are kept for a year. Everything
# else (index.html, 404.html, build-info.json, favicon.svg) is asked for again each time, so a new build is seen at once.
map $uri $rmq_cache_control {
  default "no-cache";
  "~-[A-Za-z0-9_-]{8}\.(js|css)$" "public, max-age=31536000, immutable";
}

server {
  # IPv4 only: Docker publishes the port to the container's IPv4 address, and a listener on [::] fails to start where the host has no IPv6.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  # text/javascript too: it is the type of .js in the mime.types of later versions of nginx.
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  add_header Cache-Control $rmq_cache_control always;
  # The page has its content security policy in a <meta> (ADR-0078). A header policy applies with it, so this one says only what a <meta>
  # cannot: that no other page may frame this one. Nothing else may be added here, or it would be a second policy for scripts and styles.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # As on GitHub Pages: a path that is not a file is answered with 404.html, a copy of index.html, so that the app loads and says what it can.
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;
}
