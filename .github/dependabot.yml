version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      angular:
        patterns:
          ["@angular/*", "@angular-devkit/*", "ng-packagr", "zone.js", "tslib"]
      testing:
        patterns:
          ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "fast-check"]
      playwright:
        patterns:
          ["@playwright/*", "playwright", "playwright-core", "@axe-core/*"]
      lint-and-format:
        patterns:
          [
            "eslint",
            "@eslint/*",
            "eslint-config-*",
            "typescript-eslint",
            "angular-eslint",
            "prettier",
            "globals",
          ]
      conformance:
        patterns: ["testcontainers", "@testcontainers/*", "amqplib"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss"]
    ignore:
      # The Angular compiler accepts one TypeScript minor at a time, so TypeScript moves with Angular.
      - dependency-name: typescript
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # Node 24 is the runtime (.nvmrc), so its typings stay on 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
