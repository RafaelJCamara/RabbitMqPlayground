name: Set up web
description: Node from .nvmrc and the locked npm dependencies of web/. Run it after actions/checkout.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Install dependencies
      shell: bash
      working-directory: web
      run: npm ci
